# The harbour: the starting scene of the demo game.
scenes:
  harbour:
    name: Stone Quay
    background: art/harbour.png
    walkable_area:
      - { x: 10, y: 284 }
      - { x: 630, y: 284 }
      - { x: 630, y: 350 }
      - { x: 10, y: 350 }
    entry_points:
      arrival: { x: 120, y: 320 }
      from_cliff: { x: 600, y: 322 }
    on_enter:
      - action: if
        condition:
          check: not
          condition:
            check: visited_scene
            scene: cliff
        then:
          - action: say
            text: Three nights without a light. Somebody has to climb that tower.
    hotspots:
      - id: sea
        name: harbour water
        area: { x: 0, y: 206, width: 640, height: 56 }
        interactions:
          look:
            - action: say
              actor: player
              text: Grey water, and the lighthouse out on the point.
          walk:
            - action: say
              actor: player
              text: I am a keeper's daughter, not a fish.

      - id: crates
        name: crates
        area: { x: 56, y: 228, width: 56, height: 52 }
        walk_to: { x: 96, y: 310 }
        interactions:
          look:
            - action: say
              actor: player
              text: Fishing crates, and something glinting between them.

      - id: lantern
        name: storm lantern
        area: { x: 66, y: 232, width: 26, height: 26 }
        walk_to: { x: 96, y: 310 }
        interactions:
          look:
            - action: say
              actor: player
              text: A storm lantern, still burning low.
          take:
            - action: say
              actor: player
              text: I will borrow this.
            - action: give_item
              item: lantern
            - action: set_hotspot
              hotspot: lantern
              enabled: false

      - id: barrel
        name: rain barrel
        area: { x: 466, y: 236, width: 42, height: 48 }
        walk_to: { x: 470, y: 312 }
        interactions:
          look:
            - action: say
              actor: player
              text: Black water, and something heavy at the bottom.
          use:
            - action: say
              actor: player
              text: I am not putting my arm in there. I need something with a hook.
        use_with:
          rope:
            - action: say
              actor: player
              text: Hook, splash, and up comes the key.
            - action: give_item
              item: rusty_key
          lantern:
            - action: say
              actor: player
              text: The light does not reach the bottom.

      - id: cliff_path
        name: cliff path
        area: { x: 596, y: 206, width: 44, height: 78 }
        walk_to: { x: 612, y: 300 }
        interactions:
          walk:
            - action: go_to_scene
              scene: cliff
              entry: from_harbour
          look:
            - action: say
              actor: player
              text: The path climbs the cliff towards the tower.
    actors:
      - id: marla
        name: Marla
        sprite: keeper
        position: { x: 300, y: 322 }
        scale: 1.1
        walk_to: { x: 262, y: 322 }
        interactions:
          talk:
            - action: start_dialogue
              dialogue: marla
          look:
            - action: say
              actor: player
              text: Marla has mended nets on this quay for forty years.
          take:
            - action: say
              actor: player
              text: She would not appreciate that.
